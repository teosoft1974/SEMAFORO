name: Semaforo giornaliero

on:
  schedule:
    - cron: "45 21 * * 1-5"   # 21:45 UTC nei giorni feriali, dopo la chiusura USA
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: semaforo-daily
  cancel-in-progress: false

jobs:
  calcolo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scarica dati e calcola il semaforo
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # il backfill può fallire su una fonte secondaria (es. breadth):
          # si prosegue e `run` rinormalizza i pesi sui dati disponibili
          python -m semaforo backfill || echo "::warning::backfill parziale"
          python -m semaforo run

      - name: Committa i JSON aggiornati
        run: |
          git config user.name "semaforo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Dati del $(date -u +%F)"
          git push

      - name: Prepara il sito statico
        run: |
          mkdir -p _site/data _site/templates
          cp dashboard/*.html _site/
          cp data/*.json _site/data/
          cp templates/*.csv _site/templates/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: calcolo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
